[package]
name = "pr2-gui"
version = "0.2.0"
description = "GUI for the Projekt 2 (G.M. Koenig) engine"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pr2_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
midir = "0.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
