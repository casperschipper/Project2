<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110" width="1000" height="1110" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fb0"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <style>
      .t    { font-size: 13px; fill: #222; }
      .s    { font-size: 11px; fill: #555; }
      .h    { font-size: 16px; font-weight: bold; fill: #222; }
      .ent  { fill: #2f6fb0; }
      .sp   { fill: #c7772a; }
      .nt   { fill: #3d8a4f; }
      .hdr  { font-size: 12px; font-weight: bold; letter-spacing: 1px; }
      .bar  { fill: #d7ecdc; stroke: #3d8a4f; stroke-width: 1.2; }
      .barl { font-size: 12px; fill: #1f4d2a; }
      .guide{ stroke: #2f6fb0; stroke-width: 1; stroke-dasharray: 4 3; }
      .br   { fill: none; stroke: #c7772a; stroke-width: 2; }
      .link { stroke: #888; stroke-width: 1.2; fill: none; }
      .mute { fill: #888; }
    </style>
  </defs>

  <rect width="1000" height="1110" fill="#ffffff"/>

  <text x="30" y="38" style="font-size:22px;font-weight:bold;fill:#222">Anatomy of an entry</text>
  <text x="30" y="60" class="t">An <tspan class="ent" font-weight="bold">entry</tspan> is one point in time. It is filled by one or more <tspan class="sp" font-weight="bold">instrument sub-picks</tspan>; each sub-pick gives one or more <tspan class="nt" font-weight="bold">notes</tspan>.</text>

  <!-- ============ 1. Timeline ============ -->
  <text x="30" y="98" class="h">1 · One layer over time</text>

  <!-- entry guides -->
  <line x1="90"  y1="108" x2="90"  y2="312" class="guide"/>
  <line x1="370" y1="108" x2="370" y2="312" class="guide"/>
  <line x1="550" y1="108" x2="550" y2="312" class="guide"/>
  <line x1="750" y1="108" x2="750" y2="312" class="guide"/>

  <!-- notes as bars: x = start (entry time), width = duration (100 px per second) -->
  <rect x="90"  y="115" width="320" height="22" rx="3" class="bar"/>
  <text x="97"  y="130" class="barl">Flute C5</text>
  <rect x="90"  y="145" width="200" height="22" rx="3" class="bar"/>
  <text x="97"  y="160" class="barl">Flute E4</text>
  <rect x="90"  y="175" width="360" height="22" rx="3" class="bar"/>
  <text x="97"  y="190" class="barl">Cello G#3</text>
  <rect x="370" y="205" width="100" height="22" rx="3" class="bar"/>
  <text x="377" y="220" class="barl">Oboe B3</text>
  <rect x="550" y="235" width="150" height="22" rx="3" class="bar"/>
  <text x="557" y="250" class="barl">Clarinet F4</text>
  <rect x="550" y="265" width="150" height="22" rx="3" class="bar"/>
  <text x="557" y="280" class="barl">Clarinet D5</text>

  <!-- sub-pick brackets -->
  <path d="M84,117 L79,117 L79,165 L84,165" class="br"/>
  <text x="74" y="145" class="s" text-anchor="end" style="fill:#c7772a">sub-pick 1</text>
  <path d="M84,177 L79,177 L79,195 L84,195" class="br"/>
  <text x="74" y="190" class="s" text-anchor="end" style="fill:#c7772a">sub-pick 2</text>
  <path d="M364,207 L359,207 L359,225 L364,225" class="br"/>
  <path d="M544,237 L539,237 L539,285 L544,285" class="br"/>

  <!-- duration annotations -->
  <text x="458" y="190" class="s">← duration 3.6 s: may run on past the next entry</text>
  <line x1="472" y1="216" x2="546" y2="216" stroke="#888" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="556" y="220" class="s">duration shorter than entry delay → silence until the next entry</text>

  <!-- time axis -->
  <line x1="90" y1="312" x2="960" y2="312" stroke="#444" stroke-width="1.2" marker-end="url(#arrg)"/>
  <text x="962" y="330" class="s" text-anchor="end">time</text>
  <g class="ent">
    <circle cx="90"  cy="312" r="5"/>
    <circle cx="370" cy="312" r="5"/>
    <circle cx="550" cy="312" r="5"/>
    <circle cx="750" cy="312" r="5" fill="#fff" stroke="#2f6fb0" stroke-width="1.5"/>
  </g>
  <text x="90"  y="332" class="t ent" text-anchor="middle" font-weight="bold">entry 1</text>
  <text x="370" y="332" class="t ent" text-anchor="middle" font-weight="bold">entry 2</text>
  <text x="550" y="332" class="t ent" text-anchor="middle" font-weight="bold">entry 3</text>
  <text x="750" y="332" class="t ent" text-anchor="middle">entry 4 …</text>
  <text x="90"  y="347" class="s" text-anchor="middle">t = 0.0</text>
  <text x="370" y="347" class="s" text-anchor="middle">t = 2.8</text>
  <text x="550" y="347" class="s" text-anchor="middle">t = 4.6</text>
  <text x="750" y="347" class="s" text-anchor="middle">t = 6.6</text>

  <!-- entry delay arrows -->
  <line x1="94"  y1="365" x2="366" y2="365" stroke="#2f6fb0" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="230" y="383" class="t ent" text-anchor="middle">entry delay 2.8 s</text>
  <line x1="374" y1="365" x2="546" y2="365" stroke="#2f6fb0" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="460" y="383" class="t ent" text-anchor="middle">entry delay 1.8 s</text>
  <line x1="554" y1="365" x2="746" y2="365" stroke="#2f6fb0" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="650" y="383" class="t ent" text-anchor="middle">entry delay 2.0 s</text>
  <text x="790" y="383" class="s">entry delay = time until the next entry;</text>
  <text x="790" y="397" class="s">duration = how long a note sounds.</text>
  <text x="790" y="411" class="s">The two are separate parameters.</text>

  <!-- ============ 2. Inside one entry ============ -->
  <text x="30" y="448" class="h">2 · Inside entry 1</text>

  <!-- entry box -->
  <rect x="250" y="462" width="500" height="112" rx="6" fill="#e8f0f9" stroke="#2f6fb0" stroke-width="1.5"/>
  <text x="266" y="484" class="hdr ent">ENTRY 1</text>
  <text x="266" y="505" class="t">time 0.0 s (the sum of all earlier entry delays)</text>
  <text x="266" y="523" class="t">entry delay 2.8 s: one per entry, never per note</text>
  <text x="266" y="541" class="t">vertical density: 3 notes in total</text>
  <text x="266" y="559" class="t">parameters set per chord, e.g. dynamic <tspan font-weight="bold">mf</tspan>: drawn once, shared by all notes</text>

  <path d="M430,574 C430,595 280,595 280,614" class="link"/>
  <path d="M570,574 C570,595 720,595 720,614" class="link"/>

  <!-- sub-pick boxes -->
  <rect x="90"  y="614" width="380" height="94" rx="6" fill="#fbefe2" stroke="#c7772a" stroke-width="1.5"/>
  <text x="106" y="636" class="hdr sp">SUB-PICK 1</text>
  <text x="106" y="657" class="t">instrument: <tspan font-weight="bold">Flute</tspan></text>
  <text x="106" y="675" class="t">chord size 1–2 → draws 2 notes</text>
  <text x="106" y="693" class="s">(2 of the 3 notes of density now filled)</text>

  <rect x="530" y="614" width="380" height="94" rx="6" fill="#fbefe2" stroke="#c7772a" stroke-width="1.5"/>
  <text x="546" y="636" class="hdr sp">SUB-PICK 2</text>
  <text x="546" y="657" class="t">instrument: <tspan font-weight="bold">Cello</tspan> (Flute is already used here)</text>
  <text x="546" y="675" class="t">chord size 1–3 → draws 3, cut to 1</text>
  <text x="546" y="693" class="s">(only 1 note of density left to fill)</text>

  <path d="M230,708 C230,725 180,725 180,742" class="link"/>
  <path d="M330,708 C330,725 380,725 380,742" class="link"/>
  <path d="M720,708 L720,742" class="link"/>

  <!-- note boxes -->
  <rect x="90"  y="742" width="180" height="92" rx="6" fill="#e6f3e9" stroke="#3d8a4f" stroke-width="1.5"/>
  <text x="104" y="763" class="hdr nt">NOTE 1.1</text>
  <text x="104" y="784" class="t">pitch <tspan font-weight="bold">C5</tspan> (harmony)</text>
  <text x="104" y="802" class="t">duration 3.2 s</text>
  <text x="104" y="820" class="t">dynamic <tspan class="mute">mf (entry)</tspan></text>

  <rect x="290" y="742" width="180" height="92" rx="6" fill="#e6f3e9" stroke="#3d8a4f" stroke-width="1.5"/>
  <text x="304" y="763" class="hdr nt">NOTE 1.2</text>
  <text x="304" y="784" class="t">pitch <tspan font-weight="bold">E4</tspan> (harmony)</text>
  <text x="304" y="802" class="t">duration 2.0 s</text>
  <text x="304" y="820" class="t">dynamic <tspan class="mute">mf (entry)</tspan></text>

  <rect x="630" y="742" width="180" height="92" rx="6" fill="#e6f3e9" stroke="#3d8a4f" stroke-width="1.5"/>
  <text x="644" y="763" class="hdr nt">NOTE 1.3</text>
  <text x="644" y="784" class="t">pitch <tspan font-weight="bold">G#3</tspan> (harmony)</text>
  <text x="644" y="802" class="t">duration 3.6 s</text>
  <text x="644" y="820" class="t">dynamic <tspan class="mute">mf (entry)</tspan></text>

  <text x="90" y="856" class="s">Here duration is set per note (each note draws its own) and dynamic per chord (grey: copied from the entry).</text>

  <!-- ============ 3. Harmony ============ -->
  <text x="30" y="898" class="h">3 · Harmony: where the pitches come from</text>

  <text x="90" y="924" class="s">harmony row (ROW principle):</text>
  <g font-size="14" text-anchor="middle">
    <rect x="90"  y="932" width="60" height="30" fill="#fff" stroke="#999"/><text x="120" y="952">C5</text>
    <rect x="150" y="932" width="60" height="30" fill="#fff" stroke="#999"/><text x="180" y="952">E4</text>
    <rect x="210" y="932" width="60" height="30" fill="#fff" stroke="#999"/><text x="240" y="952">G#3</text>
    <rect x="270" y="932" width="60" height="30" fill="#fff" stroke="#999"/><text x="300" y="952">B3</text>
    <rect x="330" y="932" width="60" height="30" fill="#fff" stroke="#999"/><text x="360" y="952">F4</text>
    <rect x="390" y="932" width="60" height="30" fill="#fff" stroke="#999"/><text x="420" y="952">D5</text>
    <rect x="450" y="932" width="60" height="30" fill="#f4f4f4" stroke="#bbb" stroke-dasharray="3 2"/><text x="480" y="952" fill="#999">…</text>
  </g>
  <g class="s" text-anchor="middle" style="fill:#3d8a4f">
    <text x="120" y="978">1.1</text><text x="180" y="978">1.2</text><text x="240" y="978">1.3</text>
    <text x="300" y="978">2.1</text><text x="360" y="978">3.1</text><text x="420" y="978">3.2</text>
  </g>
  <g stroke="#2f6fb0" stroke-width="1.5" fill="none">
    <path d="M93,986 L93,991 L267,991 L267,986"/>
    <path d="M273,986 L273,991 L327,991 L327,986"/>
    <path d="M333,986 L333,991 L447,991 L447,986"/>
  </g>
  <g class="s ent" text-anchor="middle">
    <text x="180" y="1006">entry 1</text><text x="300" y="1006">entry 2</text><text x="390" y="1006">entry 3</text>
  </g>

  <text x="540" y="928" class="t" font-weight="bold">ROW / INTERVAL</text>
  <text x="540" y="946" class="t">Every note takes the next value, straight through:</text>
  <text x="540" y="963" class="t">over sub-pick and entry boundaries alike.</text>
  <text x="540" y="980" class="t">So harmony is always per note.</text>
  <text x="540" y="1004" class="t" font-weight="bold">CHORD density</text>
  <text x="540" y="1022" class="t">One chord is drawn per entry. Its size is the density,</text>
  <text x="540" y="1039" class="t">and its tones are handed out to the sub-picks in order.</text>

  <!-- footer -->
  <line x1="30" y1="1058" x2="970" y2="1058" stroke="#ddd"/>
  <text x="30" y="1078" class="s">Autonomous density: sub-picks are added until the drawn density is reached; the last one is cut down if it overshoots.</text>
  <text x="30" y="1095" class="s">Instrument density: every entry has exactly one sub-pick, and that instrument's chord size is the number of notes.</text>
</svg>
